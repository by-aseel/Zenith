[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-meeting-assistant"
version = "1.1.0"
description = "Zenith: a local context-aware meeting archive with evidence-backed retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
capture = ["SoundCard>=0.4.3,<0.5", "numpy>=1.26,<3"]
transcription = ["faster-whisper>=1.1,<2"]
embeddings = ["sentence-transformers>=3,<6"]
desktop = ["pywebview>=5,<7"]
all = ["SoundCard>=0.4.3,<0.5", "numpy>=1.26,<3", "faster-whisper>=1.1,<2", "sentence-transformers>=3,<6", "pywebview>=5,<7"]

[project.scripts]
zenith = "zenith.__main__:main"

[tool.setuptools.packages.find]
include = ["zenith*", "meeting_assistant*"]

[tool.setuptools.package-data]
zenith = ["static/*.html", "static/*.css", "static/*.js"]
